<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>365 Memories</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="background"></div>
<div class="container">
    <div class="number-mask">
        <svg class="mask-svg" width="0" height="0" viewBox="0 0 1200 430" aria-hidden="true">
            <defs>
                <mask id="number-mask-svg" x="0" y="0" width="100%" height="100%" maskUnits="userSpaceOnUse">
                    <rect width="100%" height="100%" fill="black" />
                    <text x="50%" y="72%" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="360" font-weight="900" letter-spacing="-20">365</text>
                </mask>
            </defs>
        </svg>
        <div class="gallery" id="gallery"></div>
        <button class="next-button" type="button">ต่อไป</button>
    </div>
    <p class="subtitle">Memories Collection</p>
</div>
<script src="script.js"></script>
</body>

</html>
